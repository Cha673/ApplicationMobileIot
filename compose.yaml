services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/bin/sh", "/mosquitto/config/start.sh"]
    environment:
      SIMULATOR_PASSWORD: ${SIMULATOR_PASSWORD:-simulator-demo}
      BACKEND_PASSWORD: ${BACKEND_PASSWORD:-backend-demo}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-teacher-demo}
    ports:
      - "127.0.0.1:${MQTT_PORT:-1884}:1883"
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - broker-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u teacher -P \"$$TEACHER_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  simulator:
    build: .
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: simulator
      MQTT_PASSWORD: ${SIMULATOR_PASSWORD:-simulator-demo}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-2}
    volumes:
      - ./devices.json:/app/devices.json:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    init: true

  tools:
    build: .
    profiles: ["tools"]
    entrypoint: ["python", "-m", "tools.cli"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: teacher
      MQTT_PASSWORD: ${TEACHER_PASSWORD:-teacher-demo}
    depends_on:
      mosquitto:
        condition: service_healthy

  tests:
    build: .
    profiles: ["test"]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: teacher
      MQTT_PASSWORD: ${TEACHER_PASSWORD:-teacher-demo}
      BACKEND_PASSWORD: ${BACKEND_PASSWORD:-backend-demo}
      RUN_INTEGRATION: "1"
    depends_on:
      mosquitto:
        condition: service_healthy
      simulator:
        condition: service_started

volumes:
  broker-data:
