server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only scrape containers from this compose project
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        regex: applicationmobileiot
        action: keep
      # Guaranteed label so every stream has at least one
      - target_label: job
        replacement: iot
      # Service name from compose label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Container name (strip leading slash)
      - source_labels: [__meta_docker_container_name]
        regex: '/?(.+)'
        target_label: container
    pipeline_stages:
      # Only parse JSON for services that emit JSON logs
      - match:
          selector: '{service=~"backend|simulator"}'
          stages:
            - json:
                expressions:
                  level: level
                  eventType: eventType
                  deviceId: deviceId
                  status: status
            - labels:
                level:
                eventType:
                deviceId:
                status:
